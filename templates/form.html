<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absence Reasons</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0; background: #f4f5f7; color: #1f2933; line-height: 1.45;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }
    h1 { font-size: 1.4rem; margin: 12px 0 4px; }
    p.sub { color: #61707d; margin: 0 0 20px; font-size: 0.95rem; }
    .card { background: #fff; border-radius: 12px; padding: 18px 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 16px; }
    label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
    input[type=text], select {
      width: 100%; padding: 11px 12px; border: 1px solid #cbd2d9; border-radius: 8px;
      font-size: 1rem; background: #fff; margin-bottom: 14px;
    }
    input[type=text]:focus, select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
    .row { border: 1px solid #e4e7eb; border-radius: 10px; padding: 14px 12px; margin-bottom: 14px; background: #fafbfc; }
    .row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .row-head strong { font-size: 0.9rem; color: #52606d; }
    .specify-wrap { display: none; }
    .specify-wrap.show { display: block; }
    button {
      font-size: 1rem; font-weight: 600; border: none; border-radius: 8px;
      padding: 12px 16px; cursor: pointer;
    }
    .btn-primary { background: #2563eb; color: #fff; width: 100%; padding: 14px; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-add { background: #e8eefb; color: #1d4ed8; }
    .btn-add:disabled { background: #eceff1; color: #9aa5b1; cursor: not-allowed; }
    .btn-remove { background: transparent; color: #c0392b; padding: 4px 8px; font-size: 0.85rem; }
    .errors { background: #fdecea; border: 1px solid #f5c6cb; color: #8a1c1c; border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
    .errors ul { margin: 6px 0 0; padding-left: 20px; }
    .req { color: #c0392b; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Employee Absence Reasons</h1>
    <p class="sub">Please record the dates and reasons for your absences.</p>

    {% if errors %}
    <div class="errors">
      <strong>Please fix the following:</strong>
      <ul>
        {% for e in errors %}<li>{{ e }}</li>{% endfor %}
      </ul>
    </div>
    {% endif %}

    <form method="post" action="/" id="absence-form">
      <div class="card">
        <label for="name">Name <span class="req">*</span></label>
        <input type="text" id="name" name="name" value="{{ name }}" required>

        <label for="employee_code">Employee Code <span class="req">*</span></label>
        <input type="text" id="employee_code" name="employee_code" value="{{ employee_code }}" required>
      </div>

      <div class="card">
        <label>Absence dates <span class="req">*</span></label>
        <div id="rows">
          {% for row in rows %}
          <div class="row" data-row>
            <div class="row-head">
              <strong>Date entry</strong>
              <button type="button" class="btn-remove" data-remove>Remove</button>
            </div>
            <label>Date</label>
            <select name="entry_date" required>
              <option value="">— Select date —</option>
              {% for value, label in date_options %}
              <option value="{{ value }}" {% if row.entry_date == value %}selected{% endif %}>{{ label }}</option>
              {% endfor %}
            </select>

            <label>Reason</label>
            <select name="reason" data-reason required>
              <option value="">— Select reason —</option>
              {% for r in reasons %}
              <option value="{{ r }}" {% if row.reason == r %}selected{% endif %}>{{ r }}</option>
              {% endfor %}
            </select>

            <div class="specify-wrap {% if row.reason == other_reason %}show{% endif %}" data-specify-wrap>
              <label>Please specify</label>
              <input type="text" name="specify_text" data-specify value="{{ row.specify_text }}">
            </div>
          </div>
          {% endfor %}
        </div>

        <button type="button" class="btn-add" id="add-row">+ Add date</button>
        <p class="sub" style="margin-top:10px;">You can add up to {{ max_rows }} dates.</p>
      </div>

      <button type="submit" class="btn-primary">Submit</button>
    </form>
  </div>

  <!-- Template for a fresh row, cloned by JS -->
  <template id="row-template">
    <div class="row" data-row>
      <div class="row-head">
        <strong>Date entry</strong>
        <button type="button" class="btn-remove" data-remove>Remove</button>
      </div>
      <label>Date</label>
      <select name="entry_date" required>
        <option value="">— Select date —</option>
        {% for value, label in date_options %}
        <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>

      <label>Reason</label>
      <select name="reason" data-reason required>
        <option value="">— Select reason —</option>
        {% for r in reasons %}
        <option value="{{ r }}">{{ r }}</option>
        {% endfor %}
      </select>

      <div class="specify-wrap" data-specify-wrap>
        <label>Please specify</label>
        <input type="text" name="specify_text" data-specify value="">
      </div>
    </div>
  </template>

  <script>
    var MAX_ROWS = {{ max_rows }};
    var OTHER_REASON = {{ other_reason | tojson }};
    var rowsEl = document.getElementById("rows");
    var addBtn = document.getElementById("add-row");
    var tpl = document.getElementById("row-template");

    function updateState() {
      var rows = rowsEl.querySelectorAll("[data-row]");
      // Disable "Add" at the limit.
      addBtn.disabled = rows.length >= MAX_ROWS;
      // Always allow removing; keep at least one row.
      rows.forEach(function (row) {
        var removeBtn = row.querySelector("[data-remove]");
        removeBtn.style.display = rows.length > 1 ? "inline-block" : "none";
      });
    }

    function wireRow(row) {
      var reasonSel = row.querySelector("[data-reason]");
      var specifyWrap = row.querySelector("[data-specify-wrap]");
      var specifyInput = row.querySelector("[data-specify]");

      function syncSpecify() {
        var isOther = reasonSel.value === OTHER_REASON;
        specifyWrap.classList.toggle("show", isOther);
        if (isOther) {
          specifyInput.setAttribute("required", "required");
        } else {
          specifyInput.removeAttribute("required");
        }
      }
      reasonSel.addEventListener("change", syncSpecify);
      syncSpecify();

      row.querySelector("[data-remove]").addEventListener("click", function () {
        row.remove();
        updateState();
      });
    }

    // Wire up server-rendered rows.
    rowsEl.querySelectorAll("[data-row]").forEach(wireRow);
    updateState();

    addBtn.addEventListener("click", function () {
      var rows = rowsEl.querySelectorAll("[data-row]");
      if (rows.length >= MAX_ROWS) return;
      var clone = tpl.content.cloneNode(true);
      rowsEl.appendChild(clone);
      var newRow = rowsEl.lastElementChild;
      wireRow(newRow);
      updateState();
    });
  </script>
</body>
</html>
