services:
  - type: web
    name: absence-survey
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_PASSWORD
        sync: false          # set this in the Render dashboard
      - key: PYTHON_VERSION
        value: 3.12.4
      # Store the SQLite file on the persistent disk mounted below.
      - key: DB_PATH
        value: /data/absences.db
    # Persistent disk so submissions survive deploys/restarts.
    # Requires a paid (Starter+) instance — disks can't attach to Free.
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
